name: Build FS Report APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor
        id: sync
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee /tmp/sync_output.txt
        continue-on-error: true

      - name: Save diagnostic log on failure
        if: steps.sync.outcome == 'failure'
        run: |
          git config user.email "build@fsreport.local"
          git config user.name "FS Report Build"
          cp /tmp/sync_output.txt BUILD_ERROR.txt
          git add BUILD_ERROR.txt
          git commit -m "Build diagnostic log [skip ci]"
          git push

      - name: Stop here if sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Build debug APK
        id: build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee /tmp/gradle_output.txt
        continue-on-error: true

      - name: Save gradle diagnostic log on failure
        if: steps.build.outcome == 'failure'
        run: |
          git config user.email "build@fsreport.local"
          git config user.name "FS Report Build"
          tail -c 60000 /tmp/gradle_output.txt > GRADLE_ERROR.txt
          git add GRADLE_ERROR.txt
          git commit -m "Gradle diagnostic log [skip ci]"
          git push

      - name: Stop here if gradle build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: List actual build outputs
        run: |
          git config user.email "build@fsreport.local"
          git config user.name "FS Report Build"
          find android/app/build -type f -iname "*.apk" > BUILD_FILES.txt 2>&1 || true
          echo "--- full outputs tree ---" >> BUILD_FILES.txt
          find android/app/build/outputs -type f >> BUILD_FILES.txt 2>&1 || echo "outputs dir not found" >> BUILD_FILES.txt
          git add BUILD_FILES.txt
          git commit -m "Build files listing [skip ci]" || echo "nothing to commit"
          git push || echo "push failed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-report-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

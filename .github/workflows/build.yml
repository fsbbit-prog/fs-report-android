name: Build FS Report APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor
        id: sync
        run: npx cap sync android 2>&1 | tee /tmp/sync_output.txt
        continue-on-error: true

      - name: Save diagnostic log on failure
        if: steps.sync.outcome == 'failure'
        run: |
          git config user.email "build@fsreport.local"
          git config user.name "FS Report Build"
          cp /tmp/sync_output.txt BUILD_ERROR.txt
          git add BUILD_ERROR.txt
          git commit -m "Build diagnostic log [skip ci]"
          git push

      - name: Stop here if sync failed
        if: steps.sync.outcome == 'failure'
        run: exit 1

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fs-report-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
